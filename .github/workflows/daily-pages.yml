name: Daily Headlines Pages

on:
  schedule:
    # 08:00 Asia/Shanghai is 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Publish date in YYYY-MM-DD. Leave empty to use today's Asia/Shanghai date."
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-headlines-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve publish date
        shell: bash
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "PUBLISH_DATE=${{ inputs.date }}" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_DATE=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_ENV"
          fi

      - name: Collect candidates
        run: node scripts/collect-candidates.js "$PUBLISH_DATE"

      - name: Build daily issue
        run: node scripts/run-daily-pipeline.js "$PUBLISH_DATE"

      - name: Prepare Pages artifact
        run: node scripts/prepare-pages-artifact.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
